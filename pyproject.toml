[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cockroach-lab"
version = "0.1.0"
description = "Two insects, two learning brains, one tiny world."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
viewer = ["pygame-ce>=2.5.2,<3"]
dev = ["pytest>=7,<10", "ruff>=0.9,<1"]

[project.scripts]
cockroach = "cockroach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
